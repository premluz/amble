<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rios · Motion studio</title><link rel="stylesheet" href="studio.css"></head><body>
<header><strong>Rios<span> / Motion studio</span></strong><small>01 — Independent, but connected</small></header>
<main><section class="preview" id="preview"><div id="stage"></div><div class="transport"><button id="play">Play</button><button id="replay">↺ Replay</button><button id="fullscreen" aria-label="Enter full screen">Full screen</button><input id="seek" aria-label="Animation position" type="range" min="0" max="7" step=".001" value="0"><output id="clock">0.00 / 7.00</output></div><div class="phases"><span>01 &nbsp; Flow</span><span>02 &nbsp; Gather</span><span>03 &nbsp; Settle</span><span>04 &nbsp; Release</span></div><p>One current. Three individual lines.</p></section>
<aside><h1>Shape the flow.</h1><label class="select">Ending<select id="ending"><option value="out">Flow out</option><option value="hold">Logo hold</option></select></label><label class="select">Appearance<select id="theme"><option value="dark">Dark</option><option value="light">Light</option><option value="custom">Custom</option></select></label><div class="swatch-row"><label>Background <input id="background" type="color" value="#191919"></label><label>Wordmark <input id="ink" type="color" value="#F3F0EB"></label></div><div id="knobs"></div><div class="colors" id="colors"></div><div class="exports"><button id="save-config">Export settings</button><button id="save-svg">SVG frame</button><button id="save-png">PNG frame</button><button id="reset">Reset</button></div><p class="hint">Space: play or pause. Full screen: inspect the animation. Pause or scrub to tune a frame.</p></aside></main>
<script src="rios-motion.js"></script><script src="studio.js"></script></body></html>
