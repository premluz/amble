<main class="wrap">
  <p class="eyebrow">Amble · promo film · 1:04 · 16:9</p>
  <div class="frame">
    <div id="stage" role="img" aria-label="Amble promo film: one day, from a rigid calendar to a plan that moves with it."></div>
    <button id="poster-play" class="poster-play" type="button" aria-label="Play film">
      <span><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg></span>
    </button>
  </div>
  <div class="controls">
    <button id="play" class="ctl" type="button" aria-label="Play">
      <svg class="when-paused" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
      <svg class="when-playing" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h3.5v14H7zm6.5 0H17v14h-3.5z"/></svg>
      <span class="when-paused">Play</span>
      <span class="when-playing">Pause</span>
    </button>
    <input id="scrub" type="range" min="0" max="64" step="0.01" value="0" aria-label="Film position">
    <span id="time" class="time">0:00 / 1:04</span>
    <button id="restart" class="ctl" type="button">Restart</button>
  </div>
</main>
